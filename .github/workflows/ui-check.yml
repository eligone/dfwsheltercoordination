name: ui-check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ui-check:
    name: ui-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: UI rules (.claude/skills/ui/SKILL.md)
        run: npm run check:ui
      - name: Build
        run: npm run build
